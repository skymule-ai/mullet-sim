stein:
  weight_stein: 400.0
  weight_pdf: 0.0
  ell_self: 25.0
  ell_x: 64.0
  alpha_cross: 10.0
  theta: 55.0

model:
  delta_t: 0.2
  double_integrator:
    max_accel_lin_abs: 6.0
    max_accel_ang_abs: 8.0
