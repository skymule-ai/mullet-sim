seed: 43
steps: 5000

robots:
  num_robots: 1

mppi:
  T: 45
  K: 256
  lambda: 1.2
  alpha: 0.2
  exploration: 0.15
  ess_target: 0.3
  lam_min: 0.05
  lam_max: 20.0
  history_len: 100
  dim_x: 6
  dim_u: 3
  noise:
    sigma:
      - [4.0, 0.0, 0.0]
      - [0.0, 4.0, 0.0]
      - [0.0, 0.0, 2.0]

map:
  x_limits: [0.0, 100.0]
  y_limits: [0.0, 100.0]
  resolution: 1.0
  oom_cost: 1e7

  obstacles:
    num_obstacles: 6
    min_radius: 2.0
    max_radius: 5.0
    x_limits: [10.0, 90.0]
    y_limits: [10.0, 90.0]
    weight: 1e6
    safe_distance: 1.0

density:
  weights:
    - 0.3333333333
    - 0.3333333333
    - 0.3333333333
  means:
    - [20.0, 80.0]
    - [80.0, 80.0]
    - [50.0, 20.0]
  covariances:
    - [[80.0, 0.0], [0.0, 80.0]]
    - [[90.0, 10.0], [10.0, 90.0]]
    - [[100.0, 0.0], [0.0, 100.0]]

