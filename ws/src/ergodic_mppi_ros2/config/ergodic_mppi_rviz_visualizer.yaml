ergodic_mppi_rviz_visualizer:
  ros__parameters:
    px4_instances: "1"
    frame_id: "map"
    publish_rate_hz: 20.0

    pose_topic: "/fmu/out/vehicle_local_position"
    robot_marker_topic: "/ergodic_mppi_viz/robots"
    trail_topic: "/ergodic_mppi_viz/trails"
    obstacle_topic: "/ergodic_mppi_viz/obstacles"
    density_topic: "/ergodic_mppi_viz/target_density"

    mppi_config_path: ""
    drones_config_path: "/config/drones_x500_mppi.yaml"
    anchor_base: 50.0

    model_dir: "/opt/PX4-Autopilot/Tools/simulation/gz/models/x500"
    model_sdf: "model.sdf"
    mesh_resource: ""
    mesh_link_name: ""
    mesh_visual_name: ""
    mesh_scale: [10.0, 10.0, 10.0]
    mesh_xyz_offset: [0.0, 0.0, 0.0]
    mesh_rpy_offset: [0.0, 0.0, 0.0]

    trail_enable: true
    trail_z_mode: "altitude"
    trail_max_points: 120000
    trail_min_dist: 0.25
    trail_width: 0.18
    trail_alpha: 0.9

    obstacle_height_m: 12.0
    obstacle_alpha: 0.25
