# Tmux Configuration

# -- Basic Settings ------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix           # Double-tap C-a to send it to the shell

set -g escape-time 0           # No delay after Escape (critical for Vim/Neovim)
set -g history-limit 50000
set -g base-index 1            # Start windows at 1 (matches keyboard layout)
setw -g pane-base-index 1      # Start panes at 1 too
set -g renumber-windows on     # Re-number windows when one is closed
set -g mouse on
set -g focus-events on         # Let Vim/Neovim detect focus changes

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- Vi Mode -------------------------------------------------
setw -g mode-keys vi           # Use vi keys in copy mode

bind Enter copy-mode           # Enter copy mode with Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# -- Key Bindings ------------------------------------------

# Intuitive split bindings (keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"  # New window in same dir

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Pane resizing with Shift+Arrow
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=colour235'

# Left: session name
set -g status-left '#[fg=colour15,bg=colour241,bold] #S '
set -g status-left-length 20

# Right: CPU, battery, date, time, host
set -g status-right '#[fg=colour15,bg=colour241,bold] #{cpu_percentage} CPU #[fg=colour15,bg=colour245,bold] #{battery_icon} #{battery_percentage} #[fg=colour15,bg=colour241,bold] %d/%m #[fg=colour15,bg=colour245,bold] %H:%M:%S #[fg=colour15,bg=colour241,bold] #H '
set -g status-right-length 120

# Active window
setw -g window-status-current-format '#[fg=black,bg=white,bold] #I#[fg=black,bg=white]:#W#[fg=black]#F '
setw -g window-status-current-style  'bg=white'

# Inactive windows
setw -g window-status-format         '#[fg=colour244,bg=colour235] #I#[fg=colour244]:#W#[fg=colour244]#F '
setw -g window-status-style          'bg=colour235'

# -- Plugins -----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # Sensible defaults

# Navigation (Ctrl+h/j/k/l to move between panes and Vim splits)
set -g @plugin 'christoomey/vim-tmux-navigator'

# Pane management shortcuts (|, -, and more)
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Yanking to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Open files/URLs from copy mode (o to open, Ctrl+o in editor)
set -g @plugin 'tmux-plugins/tmux-open'

# Session save/restore across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar extras
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# File tree sidebar (prefix + Tab)
set -g @plugin 'tmux-plugins/tmux-sidebar'

# -- Plugin Config ------------------------------------------
set -g @continuum-restore 'on'       # Auto-restore last session on start
set -g @resurrect-capture-pane-contents 'on'

set -g @prefix_highlight_show_copy_mode 'on'

# -- Initialize TPM (keep at bottom) -----------------------
run '~/.tmux/plugins/tpm/tpm'
