# tmux config for the mullet SITL session (host tmux, dedicated socket: `tmux -L mullet`).
# Colors: Mullet Dusk. The TUI re-themes the session at runtime.
# run.sh adds bindings that need absolute paths: prefix+r reload, prefix+S stop, clickable ■ STOP.

# -- Basic Settings ------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix           # Double-tap C-a to send it to the shell

set -g escape-time 0           # No delay after Escape (critical for Vim/Neovim)
set -g history-limit 50000
set -g base-index 1            # Start windows at 1 (matches keyboard layout)
setw -g pane-base-index 1      # Start panes at 1 too
set -g renumber-windows on     # Re-number windows when one is closed
set -g mouse on
set -g focus-events on         # Let Vim/Neovim detect focus changes

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Keep a pane whose command failed (e.g. a Ctrl-C'd log tail) visible; prefix+R restarts it.
set -g remain-on-exit failed
bind R respawn-pane -k

# -- Vi Mode -------------------------------------------------
setw -g mode-keys vi           # Use vi keys in copy mode
set -g set-clipboard on        # OSC 52 → terminal clipboard on copy

bind Enter copy-mode           # Enter copy mode with Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -n MouseDown2Pane paste-buffer

# -- Key Bindings ------------------------------------------

# Intuitive split bindings (keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"  # New window in same dir

# Pane resizing with Shift+Arrow
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# -- Theme (Mullet Dusk) --------------------------------------
# Pane labels/colors come from the @mullet_label / @mullet_color pane options set by run.sh.
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#2A2F3C'
set -g pane-active-border-style 'fg=#4CC2FF'
set -g pane-border-format ' #[fg=#{?@mullet_color,#{@mullet_color},#8B93A7},bold]#{?@mullet_label,#{@mullet_label},#{pane_current_command}}#[default]'

set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#161A22,fg=#E6E9EF'
set -g message-style 'bg=#2A2F3C,fg=#E6E9EF'
set -g mode-style 'bg=#2A2F3C,fg=#E6E9EF'

set -g status-left '#[fg=#0E1116,bg=#4CC2FF,bold] ✦ mullet #[default] '
set -g status-left-length 40
set -g status-right '#{?@mullet_domain,#[fg=#8B93A7]DOMAIN #[fg=#FFB547#,bold]#{@mullet_domain}#[default]  ,}#[fg=#8B93A7]%H:%M #[fg=#0E1116,bg=#FF5470,bold]#[range=user|stop] ■ STOP #[norange]#[default]'
set -g status-right-length 60

setw -g window-status-current-format '#[fg=#0E1116,bg=#FFB547,bold] #I #W '
setw -g window-status-format '#[fg=#8B93A7] #I #W '
setw -g window-status-separator ''
