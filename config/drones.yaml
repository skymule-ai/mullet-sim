simulation:
  # Gazebo world name (PX4_GZ_WORLD). Example: default, windy, moving_platform
  world: default

  # Gazebo transport IP (GZ_IP). Use 127.0.0.1 for this single-container setup.
  # If unset, launcher defaults to 127.0.0.1 (same as `make px4_sitl ...`).
  # gz_ip: 127.0.0.1

  # Run Gazebo without GUI (set HEADLESS=1 in PX4 env). Recommended for CI.
  headless: false

  # ROS 2 DDS domain id. External ROS 2 containers must use same domain.
  ros_domain_id: 0

  # uXRCE-DDS agent transport/port. PX4 clients will connect to this agent.
  xrce_agent:
    transport: udp4
    port: 8888

# Fleet definition.
# - instance must be unique per vehicle and >= 0. Any offset is allowed (e.g. starting at 1).
# - px4_sys_autostart is the PX4 airframe autostart id.
# - px4_sim_model is the Gazebo model to spawn (PX4_SIM_MODEL), e.g. gz_x500.
# - pose uses PX4_GZ_MODEL_POSE syntax: x,y,z,roll,pitch,yaw (meters, radians).
#
# Instance numbering and ROS 2 topic prefixes:
#   instance 0  -> PX4 publishes to unprefixed topics (/fmu/...)
#   instance N  -> PX4 publishes to /px4_N/fmu/...
# Starting your fleet at instance 1 gives you /px4_1/... for every vehicle,
# which is the most common setup for multi-robot ROS 2 work.
fleet:
  # Starting at instance 1 gives ROS 2 prefixes /px4_1/... and /px4_2/...
  - id: x500_1
    instance: 1
    px4_sys_autostart: 4001
    px4_sim_model: gz_x500
    pose: [0.0, 0.0, 0.2, 0.0, 0.0, 0.0]
