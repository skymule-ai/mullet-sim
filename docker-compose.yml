# Base services. run.sh adds docker-compose.gpu.yml (NVIDIA hosts) and, if present,
# docker-compose.override.yml (your local extra mounts, gitignored).
services:
  px4_sitl:
    image: ${PX4_SITL_IMAGE:-ghcr.io/skymule-ai/px4-sitl:v1.17.0}
    container_name: mullet_px4_sitl
    privileged: true
    shm_size: "2g"
    stdin_open: true
    tty: true
    # Lifecycle is owned by run.sh / stop.sh (no auto-restart after reboot).
    restart: "no"

    environment:
      - QT_QPA_PLATFORM=xcb
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - CONFIG_FILE=${CONFIG_FILE:-/config/drones.yaml}
      - WORKSPACE_DIR=/ws
      - MULLET_RUNTIME_DIR=/tmp/runtime
      - PX4_BIN=${PX4_BIN:-/opt/PX4-Autopilot/build/px4_sitl_default/bin/px4}
      - MULLET_RESET_PARAMS=${MULLET_RESET_PARAMS:-0}
      - MULLET_PX4_REBUILD=${MULLET_PX4_REBUILD:-0}
      - XRCE_DOMAIN_ID_OVERRIDE=${ROS_DOMAIN_ID:-0}
      - MULLET_DOMAIN_OVERRIDE=${MULLET_DOMAIN_OVERRIDE:-}
      - ENTRYPOINT_MODE=sitl
      - MULLET_HEADLESS=${MULLET_HEADLESS:-0}
      - PX4_GZ_SIM_RENDER_ENGINE=${PX4_GZ_SIM_RENDER_ENGINE:-ogre2}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./ws:/ws:rw
    tmpfs:
      - /tmp/runtime:uid=1000,gid=1000,mode=1777
    working_dir: /ws
    deploy:
      resources:
        limits:
          memory: 8g
    entrypoint: ["/usr/bin/env", "bash", "/scripts/entrypoint.sh"]

    # Host networking is the most reliable way to make QGroundControl work
    # with PX4 SITL in Docker, because PX4's default MAVLink config is bound
    # to localhost for SITL.
    #
    # With host networking:
    # - QGC auto-connect works (PX4 sends to 127.0.0.1:14550).
    # - No explicit UDP port publishing is needed.
    network_mode: host

  px4_no_sitl:
    image: ${PX4_SITL_IMAGE:-ghcr.io/skymule-ai/px4-sitl:v1.17.0}
    container_name: mullet_px4_no_sitl
    privileged: true
    shm_size: "2g"
    stdin_open: true
    tty: true
    restart: unless-stopped

    environment:
      - QT_QPA_PLATFORM=xcb
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - CONFIG_FILE=${CONFIG_FILE:-/config/drones.yaml}
      - WORKSPACE_DIR=/ws
      - MULLET_RUNTIME_DIR=/tmp/runtime
      - PX4_BIN=${PX4_BIN:-/opt/PX4-Autopilot/build/px4_sitl_default/bin/px4}
      - MULLET_RESET_PARAMS=${MULLET_RESET_PARAMS:-0}
      - MULLET_PX4_REBUILD=${MULLET_PX4_REBUILD:-0}
      - XRCE_DOMAIN_ID_OVERRIDE=${ROS_DOMAIN_ID:-0}
      - MULLET_DOMAIN_OVERRIDE=${MULLET_DOMAIN_OVERRIDE:-}
      - ENTRYPOINT_MODE=no_sitl
      - PX4_GZ_SIM_RENDER_ENGINE=${PX4_GZ_SIM_RENDER_ENGINE:-ogre2}
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./ws:/ws:rw
    tmpfs:
      - /tmp/runtime:uid=1000,gid=1000,mode=1777
    working_dir: /ws
    deploy:
      resources:
        limits:
          memory: 8g
    entrypoint: ["/usr/bin/env", "bash", "/scripts/entrypoint.sh"]
    network_mode: host
