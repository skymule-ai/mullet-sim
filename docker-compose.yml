services:
  px4_sitl:
    image: ghcr.io/skymule-ai/px4-sitl:v1.16.1
    container_name: mullet_px4_sitl
    privileged: true
    shm_size: "2g"
    stdin_open: true
    tty: true
    restart: unless-stopped

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DISABLE_REQUIRE=1
      # Keep GLX vendor selection automatic by default: forcing `nvidia`
      # here can break GLX context creation on some hosts or when Mesa is used.
      # - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - CONFIG_FILE=/config/drones.yaml
      - WORKSPACE_DIR=/ws
      - MULLET_RUNTIME_DIR=/tmp/runtime
      - PX4_BIN=${PX4_BIN:-/opt/PX4-Autopilot/build/px4_sitl_default/bin/px4}
      - MULLET_RESET_PARAMS=${MULLET_RESET_PARAMS:-0}
      - MULLET_PX4_REBUILD=${MULLET_PX4_REBUILD:-0}
      - XRCE_DOMAIN_ID_OVERRIDE=${ROS_DOMAIN_ID:-0}
      - PYTHONPATH=/ws/venv/lib/python3.10/site-packages:/opt/ros/humble/lib/python3.10/site-packages
      - ENTRYPOINT_MODE=sitl
      # Uncomment if you have rendering issues in Gazebo
      # - PX4_GZ_SIM_RENDER_ENGINE=${PX4_GZ_SIM_RENDER_ENGINE:-ogre}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./ws:/ws:rw
      - ./.venv:/ws/venv              # mount the venv explicitly (or covered by above)
      # NVIDIA libs (EGL, GLX) are injected automatically by
      # nvidia-container-toolkit >= 1.14. Only the Vulkan ICD needs
      # an explicit mount since the container image lacks it.
      - /usr/share/vulkan/icd.d/nvidia_icd.json:/usr/share/vulkan/icd.d/nvidia_icd.json:ro
    tmpfs:
      - /tmp/runtime:uid=1000,gid=1000,mode=1777
    working_dir: /ws
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/usr/bin/env", "bash", "/scripts/entrypoint.sh"]
    
    # Host networking is the most reliable way to make QGroundControl work
    # with PX4 SITL in Docker, because PX4's default MAVLink config is bound
    # to localhost for SITL.
    #
    # With host networking:
    # - QGC auto-connect works (PX4 sends to 127.0.0.1:14550).
    # - No explicit UDP port publishing is needed.
    network_mode: host

  px4_no_sitl:
    image: ghcr.io/skymule-ai/px4-sitl:v1.16.1
    container_name: mullet_px4_no_sitl
    privileged: true
    shm_size: "2g"
    stdin_open: true
    tty: true
    restart: unless-stopped

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DISABLE_REQUIRE=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - CONFIG_FILE=/config/drones.yaml
      - WORKSPACE_DIR=/ws
      - MULLET_RUNTIME_DIR=/tmp/runtime
      - PX4_BIN=${PX4_BIN:-/opt/PX4-Autopilot/build/px4_sitl_default/bin/px4}
      - MULLET_RESET_PARAMS=${MULLET_RESET_PARAMS:-0}
      - MULLET_PX4_REBUILD=${MULLET_PX4_REBUILD:-0}
      - XRCE_DOMAIN_ID_OVERRIDE=${ROS_DOMAIN_ID:-0}
      - PYTHONPATH=/ws/venv/lib/python3.10/site-packages:/opt/ros/humble/lib/python3.10/site-packages
      - ENTRYPOINT_MODE=no_sitl
      # Uncomment if you have rendering issues in Gazebo
      # - PX4_GZ_SIM_RENDER_ENGINE=${PX4_GZ_SIM_RENDER_ENGINE:-ogre}
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./ws:/ws:rw
      - ./.venv:/ws/venv              # mount the venv explicitly (or covered by above)
    tmpfs:
      - /tmp/runtime:uid=1000,gid=1000,mode=1777
    working_dir: /ws
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/usr/bin/env", "bash", "/scripts/entrypoint.sh"]
    network_mode: host
