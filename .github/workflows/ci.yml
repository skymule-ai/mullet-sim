name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tui:
    name: TUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tui/go.sum
      - name: Test
        working-directory: tui
        run: go test ./...
      - name: Vet
        working-directory: tui
        run: go vet ./...

  spawn_fleet:
    name: spawn_fleet parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate example session
        run: python3 scripts/spawn_fleet.py --config config/sessions/example_uav.yaml --print-env
