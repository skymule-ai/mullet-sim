name: Publish PX4 SITL image

on:
  push:
    tags:
      - "px4-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The Jazzy image (desktop-full + Gazebo Harmonic + PX4 build) outgrows the ~14 GB a hosted
      # runner has free: drop preinstalled toolchains this build never uses (~30 GB).
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Parse PX4 version from tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. px4-v1.17.0
          PX4_VERSION="${TAG#px4-}"         # -> v1.17.0

          if [[ ! "$PX4_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Unexpected tag format: $TAG"
            exit 1
          fi

          echo "px4_version=$PX4_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          file: image/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/px4-sitl:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/px4-sitl:${{ steps.meta.outputs.px4_version }}
          build-args: |
            ros_version=jazzy
            PX4_VERSION=${{ steps.meta.outputs.px4_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max